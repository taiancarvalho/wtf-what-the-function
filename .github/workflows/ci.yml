# O WTF só foi executado no macOS. Os três sistemas rodam aqui porque o código
# trata plataforma em vários pontos — pasta de dados, shell, terminal externo,
# moldura da janela — e nenhum deles tinha prova fora do Mac.
name: Conferências

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conferir:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Sem fail-fast: quando o Windows quebra, ainda queremos saber se o Linux
      # passou. Um cancela o outro justamente no caso que interessa.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      # Abre a janela DE VERDADE. Os testes acima cobrem só os bastidores, e o
      # app já foi lançado com opções de macOS que no Windows deixariam a
      # janela sem botão de fechar — sem ninguém notar, porque nada abria o app
      # fora do Mac.
      - name: A janela abre (Linux)
        if: runner.os == 'Linux'
        # Sem tela no runner: o xvfb dá uma. `--no-sandbox` porque o sandbox do
        # Chromium precisa de privilégio que o contêiner não tem.
        run: xvfb-run -a npx electron . --no-sandbox
        env:
          WTF_SMOKE: '1'
          NODE_ENV: production

      - name: A janela abre
        if: runner.os != 'Linux'
        run: npx electron .
        env:
          WTF_SMOKE: '1'
          NODE_ENV: production
